<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>부산 구별 여행 경로</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 조건 패널(위) → 구 선택 레일 → 지하철 노선도처럼 그린 일자별 경로 → 전체 구 비교표 → 출처 */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --ink:#15232b; --muted:#5b6b74; --line:#d5dde1;
  --l1:#e8650a; /* 부산 1호선 */ --l2:#4f9a2c; /* 2호선 */ --l3:#a97c10; /* 3호선 */
  --accent:#e8650a; --chip:#e9eef0; --warn:#a4470b; --warnbg:#fdf0e6;
  --pa:#6a3fb8; --pabg:#efe9fa; /* 패스 A(PURPLE) */ --pb:#1f5fbf; --pbbg:#e6eefb; /* 패스 B(BLUE) */
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#16222a; --ink:#e6ecef; --muted:#97a8b1; --line:#2a3a43;
  --l1:#ff8a3d; --l2:#7cc457; --l3:#d6a73a; --accent:#ff8a3d; --chip:#1f2e36; --warn:#ffb27a; --warnbg:#2c1f15;
  --pa:#c3a6f5; --pabg:#2a2140; --pb:#8fb6f5; --pbbg:#18263d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#16222a; --ink:#e6ecef; --muted:#97a8b1; --line:#2a3a43;
  --l1:#ff8a3d; --l2:#7cc457; --l3:#d6a73a; --accent:#ff8a3d; --chip:#1f2e36; --warn:#ffb27a; --warnbg:#2c1f15;
  --pa:#c3a6f5; --pabg:#2a2140; --pb:#8fb6f5; --pbbg:#18263d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-start}
header > div{min-width:0;flex:1 1 420px}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px);line-height:1.15}
h2{font-size:22px}
.lede{color:var(--muted);max-width:65ch;margin:6px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted)}
.rail{display:flex;flex-wrap:wrap;gap:6px}
.rail button{font:inherit;font-size:14px;border:none;background:var(--chip);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.rail button[aria-pressed="true"]{background:var(--accent);color:#fff}
.summary{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
.summary .gu{font-family:var(--display);font-size:30px}
.pill{font-size:12.5px;background:var(--chip);border-radius:999px;padding:2px 10px;color:var(--ink)}
.days{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 10px;min-width:0}
.dayhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:12px;color:#fff;border-radius:4px;padding:2px 8px}
.dayhead b{font-size:16px}
.dayhead span{color:var(--muted);font-size:13px}
ol.line{list-style:none;margin:0;padding:0;position:relative}
ol.line li{position:relative;padding:0 0 14px 44px;min-height:30px}
ol.line li::before{content:"";position:absolute;left:15px;top:6px;bottom:-6px;width:4px;background:var(--c)}
ol.line li:last-child::before{display:none}
ol.line li .dot{position:absolute;left:8px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--c)}
ol.line li.meal .dot,ol.line li.cafe .dot,ol.line li.stay .dot{width:12px;height:12px;left:11px;top:7px;border-width:3px;background:var(--c)}
.t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.nm{font-weight:700}
.nm a{color:inherit;text-decoration:none}
.kind{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.sub{font-size:13px;color:var(--muted)}
.warn{font-size:12.5px;color:var(--warn);background:var(--warnbg);border-radius:5px;padding:1px 7px;display:inline-block;margin-top:3px}
.passb{font-size:12.5px;font-weight:700;border-radius:5px;padding:1px 7px;display:inline-block;margin-top:3px;color:var(--pb);background:var(--pbbg)}
.passb.A{color:var(--pa);background:var(--pabg)}
.passb.near{font-weight:500}
.courses{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.course{--c:var(--pb)}
.leg{font-size:12px;color:var(--muted);margin-top:5px}
.ico{display:inline-flex;gap:3px;vertical-align:-3px}
.ico svg{width:15px;height:15px;flex:none}
.dayhead .ico svg{width:16px;height:16px}
.nmlink{font:inherit;font-weight:700;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left;text-decoration:none}
.nmlink:hover{color:var(--accent)}
td .nmlink{font-weight:500}
.nmlink:focus-visible,.dlgfoot button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto}
dialog::backdrop{background:rgba(8,16,20,.5)}
.dlg{padding:20px 20px 8px;display:flex;flex-direction:column;gap:16px}
.dlg h3{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.dlgdesc{display:flex;flex-direction:column;gap:4px}
.dlgsec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.linkrow a{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink);text-decoration:none;background:var(--bg)}
.linkrow a:hover{border-color:var(--accent)}
.dlgfoot{display:flex;justify-content:flex-end;padding:8px 20px 18px}
.dlgfoot button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 16px;cursor:pointer}
.tips{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.tips ul{margin:6px 0 0;padding-left:18px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:none}
td a{color:inherit;text-decoration:none}
td button{font:inherit;font-weight:700;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;text-align:left}
.notes{color:var(--muted);font-size:13.5px;max-width:80ch}
.notes li{margin-bottom:4px}
@media (prefers-reduced-motion:no-preference){.day{animation:in .25s ease-out both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

</head>

    <div>

      <p class="lede" data-i="lede"></p>

  <section id="plan" style="display:flex;flex-direction:column;gap:16px"></section>

  <section style="display:flex;flex-direction:column;gap:10px">

  <section>

    <ul class="notes" id="src"></ul>
  </section>
</div>

<dialog id="dlg" aria-labelledby="dlgtitle"><div id="dlgbody"></div><div class="dlgfoot"><button type="button" id="dlgclose">닫기</button></div></dialog>

function foodFit(cat){
  const has = re => re.test(cat);
  const share = has(/고기|갈비|^회$|참치|곱창|중식|중국|조개|샤브|장어|해물|매운탕|피자|한식$/);
  const solo  = has(/국밥|국수|냉면|일식$|돈까스|햄버거|곰탕|칼국수|분식|한식뷔페|초밥|일식집|베트남|양식|퓨전/);
  const kid   = has(/돈까스|햄버거|피자|중식|중국|곰탕|양식|국수|이탈리안|한식뷔페|해물,생선|갈비|고기|일식$|초밥/);
  const old   = has(/국밥|곰탕|한식|^회$|해물|칼국수|냉면|국수|장어|매운탕|중식|중국|갈비|초밥|일식집|참치/);
  const date  = has(/양식|이탈리안|일식|초밥|베트남|피자|퓨전|샤브|^회$|고기|갈비|곱창|조개/);
  return {share,solo,kid,old,date};
}

function spotsFor(gu, type, month, pass){
  const list=[];
  for(const [name,a] of Object.entries(ATTR)){
    if(a.gu!==gu) continue;
    const m=META[name]; if(!m) continue;
    const fit=m.fit[type]; if(!fit) continue;
    if(type==="o" && m.steep) continue;
    if(m.season && !m.season.includes(month)) continue;
    const idx=a.idx[month-1]||0;
    let score = fit*2 + Math.log10(a.r12+50) + Math.min(idx,2)*1.2;
    if((type==="o"||type==="k") && m.in && [12,1,2,7,8].includes(month)) score+=0.6;
    if(pass && PASS[name]) score += PASS[name].lv==="near" ? 0.6 : 1.5;
    list.push({name,a,m,score,idx});
  }
  return list.sort((x,y)=>y.score-x.score);
}

function pickFood(gu, kind, ctx, used, pref){
  const list=(FOOD[gu]||{})[kind]||[];
  const scored=list.filter(r=>!used.has(r.name)).map(r=>{
    let s=r.rating + Math.log10(r.reviews)*0.15 - (r.warn?0.15:0);
    if(kind==="food"){
      const f=foodFit(r.cat);
      if(ctx.ppl===1) s+= f.solo?0.6:-0.6;
      if(ctx.ppl>=3) s+= f.share?0.5:0;
      if(ctx.type==="k") s+= f.kid?0.6:-0.8;
      if(ctx.type==="o") s+= f.old?0.6:-0.8;
      if(ctx.type==="c") s+= f.date?0.4:0;
      if(ctx.type==="f") s+= f.share?0.3:0;
      if(pref==="dinner" && ctx.ppl>=2) s+= f.share?0.3:0;
      if(pref==="lunch") s+= f.solo?0.2:0;
    }else{
      if(r.rating<4) s-=0.6;
      if(ctx.type==="k"||ctx.type==="o") s+= /디저트/.test(r.cat)?0.3:0;
    }
    return {...r,s};
  }).sort((a,b)=>b.s-a.s);
  const r=scored[0]; if(r) used.add(r.name); return r;
}

  car:'<path d="M4 18v-5l2.2-5.5h11.6L20 13v5z"/><path d="M4 13h16M7.5 15.5h.01M16.5 15.5h.01M6 18v2M18 18v2"/>',
  train:'<rect x="5" y="7" width="14" height="11" rx="3"/><path d="M9 3h6M12 3v4M5 12h14M8.5 22l2-4M15.5 22l-2-4"/>',
};
const ICON_NAME = {subway:["지하철","Subway"],bus:["버스","Bus"],car:["택시·자차","Taxi or car"],train:["해변열차","Beach train"]};
const icons = modes => `<span class="ico">${modes.map(m=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${L(...ICON_NAME[m])}"><title>${L(...ICON_NAME[m])}</title>${ICON_PATH[m]}</svg>`).join("")}</span>`;
const legNote = (modes, time) => `<div class="leg">↓ ${L("다음 장소까지","To the next stop:")} ${icons(modes)} ${esc(time)}</div>`;

/* 장소 상세 창: 이름 버튼마다 등록해 두고 누르면 창에 설명·지도·길찾기를 보여 줌 */
const REG = [];
function nameBtn(it, prev, next, move){
  const id = REG.push({it, prev, next, move}) - 1;
  return `<button type="button" class="nmlink" data-r="${id}">${esc(it.name)}</button>`;
}
function placeHTML(r){
  const {it, prev, next, move} = r;
  const kakao = it.url || placeURL(it.q);
  const naver = `https://map.naver.com/p/search/${E("부산 "+it.q)}`;
  const a = (u,t) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
  const dir = (x,y) => legLinks(x.q, y.q).map(([u,t])=>a(u,t)).join("");
  let h = `<div class="dlg"><div><span class="kind">${esc(it.label||"")}</span><h3 id="dlgtitle">${esc(it.name)}</h3>${it.name!==it.q?`<div class="sub">${esc(it.q)}</div>`:""}</div>`;
  h += `<div class="dlgdesc"><div>${esc(it.sub)}</div>${it.meta?`<div class="sub">${esc(it.meta)}</div>`:""}${passBadges(it.pass)}${(it.warn||[]).map(w=>`<span class="warn">${esc(w)}</span> `).join("")}</div>`;
  h += `<div class="dlgsec"><span class="label">${L("지도에서 보기","View on a map")}</span><div class="linkrow">${a(kakao,L("카카오맵","Kakao Map"))}${a(naver,L("네이버 지도","Naver Map"))}</div></div>`;
  if(prev || next){
    h += `<div class="dlgsec"><span class="label">${L("길찾기 (대중교통)","Directions (public transit)")}</span>`;
    if(prev) h += `<div><div class="sub">${esc(prev.name)} → ${esc(it.name)}</div><div class="linkrow">${dir(prev,it)}</div></div>`;
    if(next) h += `<div><div class="sub">${esc(it.name)} → ${esc(next.name)}${move?` · ${esc(move)}`:""}</div><div class="linkrow">${dir(it,next)}</div></div>`;
    h += `</div>`;
  }
  return h + `</div>`;
}
function openPlace(id){
  const r = REG[id]; if(!r) return;
  $("dlgbody").innerHTML = placeHTML(r);
  $("dlgclose").textContent = L("닫기","Close");
  const d = $("dlg"); if(d.showModal && !d.open) d.showModal();
}
function nameClick(e){ const b=e.target.closest(".nmlink"); if(b){ openPlace(+b.dataset.r); return true; } return false; }
const foodSub = r => `${CN(r.cat)} · ★${r.rating} (${r.reviews}) · ${r.addr.replace(/^부산 /,"")}`;

const fmt = h => { const H=Math.floor(h), M=Math.round((h-H)*60); return String(H).padStart(2,"0")+":"+String(M).padStart(2,"0"); };

function planDay(gu, ctx, used, dayNo, total){
  const isFirst=dayNo===1, isLast=dayNo===total && total>1;
  const spots=spotsFor(gu,ctx.type,ctx.month,ctx.pass);
  const light = ctx.type==="o" || ctx.type==="k";
  let n = light?2:3; if(isLast) n=2;
  const wantNight = !light && !isLast;
  const night = wantNight ? spots.find(s=>s.m.night) : null;
  const day=spots.filter(s=>s!==night).slice(0, night? n-1 : n);
  day.sort((a,b)=>a.m.ord-b.m.ord);
  const items=[]; let t = (isFirst && total>1)? 11 : 10;
  if(ctx.type==="o") t+=0.5;
  const byCar = ctx.ppl>=3||light;
  const move = byCar ? L("택시·자차 약 15~30분(추정)","Taxi or car, about 15–30 min (est.)") : L("지하철·버스 약 20~40분(추정)","Subway or bus, about 20–40 min (est.)");
  const modes = byCar ? ["car"] : ["subway","bus"];
  const time = byCar ? L("약 15~30분(추정)","about 15–30 min (est.)") : L("약 20~40분(추정)","about 20–40 min (est.)");
  const pushSpot=(s,label)=>{
    const warn=[];
    if(s.m.steep) warn.push(L("계단·오르막 많음","Many stairs and slopes"));
    if(s.a.manual) warn.push(L("검색 데이터 밖, 직접 추가한 장소","Not in search data; added by hand"));
    else {
      if(s.a.pub<40) warn.push(L(`46개월 중 ${s.a.pub}개월만 상위 30위 공개`,`In the public top 30 for only ${s.a.pub} of 46 months`));
      if(!s.a.r12) warn.push(L("최근 12개월 상위 30위 밖","Outside the top 30 in the last 12 months"));
    }
    items.push({kind:"spot",t:fmt(t),label,key:s.name,q:s.name,name:SN(s.name),url:s.a.manual?null:placeURL(s.name),sub:L(`${SD(s.name)} · 약 ${s.m.h}시간`,`${SD(s.name)} · about ${s.m.h} h`),
      meta: s.a.manual ? "" : L(`최근 12개월 검색 ${s.a.r12.toLocaleString()}건 · ${ctx.month}월 수요 지수 ${(s.idx||0).toFixed(2)}`,
                                `${s.a.r12.toLocaleString()} searches in the last 12 months · ${MON_EN[ctx.month-1]} demand index ${(s.idx||0).toFixed(2)}`),
      warn, pass: ctx.pass && PASS[s.name] ? PASS[s.name] : null});
    t+=s.m.h+0.4;
  };
  const pushFood=(kind,label,pref)=>{
    const r=pickFood(gu,kind,ctx,used,pref); if(!r) return;
    items.push({kind:kind==="food"?"meal":"cafe",t:fmt(t),label,name:r.name,url:r.url,q:r.name,sub:foodSub(r),warn:r.warn?[L("평가 50건 미만","Fewer than 50 reviews")]:[]});
    t+= kind==="food"?1.1:0.8;
  };
  if(day[0]) pushSpot(day[0],L("관광","Sight"));
  if(t<11.5) t=11.5;
  pushFood("food",L("점심","Lunch"),"lunch");
  if(day[1]) pushSpot(day[1],L("관광","Sight"));
  pushFood("cafe",L("카페","Cafe"));
  if(day[2]) pushSpot(day[2],L("관광","Sight"));
  if(!isLast){
    t=Math.max(t, light?17.5:18);
    pushFood("food",L("저녁","Dinner"),"dinner");
    if(night){ t=Math.max(t,19.5); pushSpot(night,L("야간","Night")); }
    if(total>1) items.push({kind:"stay",t:fmt(Math.max(t,light?19.5:21.5)),label:L("숙소","Stay"),name:L(ST(ctx.home)+" 권역",ST(ctx.home)+" area"),
      sub: [L("게스트하우스·비즈니스호텔 1인실","Guesthouse or business hotel, single"),L("더블·트윈룸","Double or twin room"),L("트리플·패밀리룸","Triple or family room"),L("4인 패밀리룸·레지던스","Family room for 4 or serviced residence")][ctx.ppl-1],
      warn: dayNo>1 && gu!==ctx.home ? [L("숙소로 돌아가는 이동 포함","Includes the trip back to your lodging")]:[]});
  } else {
    items.push({kind:"stay",t:fmt(Math.max(t,15)),label:L("귀가","Return"),name:L("부산역·김해공항·사상터미널 방향으로 이동","Head to Busan Station, Gimhae Airport or Sasang Terminal"),sub:L("출발 시각에 맞춰 마지막 일정 조정","Adjust the last stop to your departure time"),warn:[]});
  }
  return {gu,items,move,modes,time,spotCount:day.length+(night?1:0)};
}

function buildTrip(home, ctx){
  const used=new Set();
  const gus=[home, ...(NEIGH[home]||[])].slice(0,ctx.dur);
  ctx={...ctx,home};
  return gus.map((g,i)=>planDay(g,ctx,used,i+1,ctx.dur));
}

function tipsFor(ctx){
  const t=[];
  const tr = {1:["혼자라면 지하철·버스가 가장 쌉니다. 산 위 전망대처럼 대중교통이 불편한 곳만 택시를 쓰세요.","Traveling solo, the subway and buses are cheapest. Take a taxi only to places transit serves poorly, such as hilltop lookouts."],
              2:["2명은 대중교통 위주로 다니고, 구 사이를 넘을 때 택시를 섞으면 시간이 절약됩니다.","For two, use public transit and add a taxi when crossing districts to save time."],
              3:["3명이면 택시 요금을 나눠도 대중교통과 비슷해집니다. 택시 한 대로 이동하세요.","For three, a shared taxi costs about the same as transit. Take one taxi."],
              4:["4명은 택시 한 대 정원이 꽉 찹니다. 짐이 있거나 2박 이상이면 렌터카가 편합니다.","Four people fill one taxi. With luggage or for two nights or more, a rental car is easier."]};
  t.push(L(...tr[ctx.ppl]));
  if(ctx.ppl>=3) t.push(L("3~4명은 맛집 웨이팅이 길어지기 쉬우니 점심은 11:30 전, 저녁은 17:30 전에 들어가세요. 고기·회·중식처럼 나눠 먹는 메뉴를 우선 골랐습니다.","Groups of 3–4 wait longer at popular restaurants, so arrive before 11:30 for lunch and 17:30 for dinner. Shareable food such as Korean BBQ, raw fish and Chinese is ranked first."));
  if(ctx.ppl===1) t.push(L("1인 손님이 받기 쉬운 국밥·밀면·돈까스·일식 위주로 식당을 골랐습니다.","Restaurants lean toward solo-friendly menus such as gukbap, cold noodles, tonkatsu and Japanese."));
  const ty={s:["혼자: 하루 3곳과 야경 1곳. 사찰·전시처럼 혼자 둘러보기 좋은 곳에 가중치를 줬습니다.","Solo: 3 sights plus 1 night view a day, weighted toward temples and exhibits that are easy to enjoy alone."],
            f:["친구: 하루 3곳과 야경 1곳. 체험·야경·나눠 먹는 메뉴를 우선했습니다.","Friends: 3 sights plus 1 night view a day, favoring activities, night views and shareable food."],
            fa:["가족: 하루 3곳과 저녁 뒤 야경 1곳. 세대가 함께 걷기 무난한 곳을 우선했습니다.","Family: 3 sights plus a night view after dinner, favoring places every age can walk easily."],
            c:["연인: 하루 3곳과 야경 1곳. 전시·바다·야경 장소와 분위기 있는 식당을 우선했습니다.","Couple: 3 sights plus 1 night view a day, favoring exhibits, the sea, night views and restaurants with atmosphere."],
            o:["노약자 동반: 하루 2곳으로 줄이고 계단·오르막이 많은 곳은 뺐습니다. 출발을 30분 늦추고 저녁을 일찍 마칩니다.","With seniors: 2 sights a day, skipping places with many stairs or steep paths. Start 30 minutes later and finish dinner early."],
            k:["아이 동반: 하루 2곳, 체험·실내 장소 우선. 날 것·매운 메뉴는 순위를 낮췄습니다. 여름·겨울에는 실내 장소에 가중치를 더 줍니다.","With kids: 2 sights a day, favoring hands-on and indoor places. Raw and spicy food ranks lower. Indoor places get extra weight in summer and winter."]};
  t.push(L(...ty[ctx.type]));
  if(ctx.pass) t.push(L("패스 무료입장 시설이 있는 장소를 먼저 골랐습니다. 이런 장소는 중구·서구·영도구·해운대구·수영구·사하구에만 있어서, 나머지 구는 패스가 없을 때와 경로가 같습니다. 패스 종류·가격·이용 규칙은 구매 전에 공식 안내를 확인하세요.",
                        "Places with Visit Busan Pass free entry are picked first. They are only in Jung-gu, Seo-gu, Yeongdo-gu, Haeundae-gu, Suyeong-gu and Saha-gu, so other districts get the same route as without a pass. Check pass types, prices and rules on the official site before you buy."));
  if(ctx.dur>1) t.push(L("숙소 권역은 일반적인 숙박 밀집 지역 제안이며 숙소 데이터는 없습니다. 둘째 날부터는 이웃 구를 돌고 같은 숙소로 돌아오는 일정입니다.",
                         "Stay areas are general suggestions for neighborhoods with many places to stay; there is no lodging data. From day 2 you visit a neighboring district and return to the same lodging."));
  return t;
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function passBadges(p){
  if(!p) return "";
  return p.items.map(([ko,en,g])=>`<span class="passb ${g}${p.lv==="near"?" near":""}">${p.lv==="near"?L("근처 패스 시설","Pass spot nearby"):L("패스 무료","Pass free")} · ${esc(L(ko,en))}</span> `).join("");
}

function renderCourses(ctx){
  let h=`<h2 style="margin-top:8px">${L("패스로 무료입장 시설을 몰아 도는 하루 코스","Day courses that bundle pass free-entry spots")}</h2><p class="hint">${L("패스 시설이 모여 있는 두 권역입니다. 식당·카페는 지금 고른 조건에 맞춰 바뀝니다.","Two areas where pass facilities cluster. Restaurants and cafes change with your conditions.")}</p><div class="courses">`;
  PASS_COURSES.forEach(c=>{
    const used=new Set();
    let n=0; const parts=[];
    c.steps.forEach(s=>{
      if(s.kind==="spot"){
        const nm="§NM§";
        if(ctx.type==="o" && (s.active||s.steep)) { parts.push({q:null,name:L(...s.name),h:`<li class="spot"><span class="dot"></span><div><span class="t">${s.t}</span> <span class="kind">${L("건너뜀","Skipped")}</span><span class="nm">${nm}</span></div><div class="sub">${L("노약자 동반이라 뺐습니다. 이 시간에는 근처 카페에서 쉬어 가세요.","Left out for travelers with seniors. Rest at a nearby cafe instead.")}</div>`}); return; }
        n++;
        const w=[]; if(ctx.type==="k" && s.active) w.push(L("아이 참여 가능 연령 업체 확인","Check the minimum age with the shop")); if(s.steep) w.push(L("계단·오르막 있음","Some stairs and slopes"));
        parts.push({q:s.name[0],it:{kind:"spot",label:GN(s.gu),name:L(...s.name),q:s.name[0],sub:L(...s.sub),warn:w,pass:{lv:"same",items:[[s.name[0],s.name[1],s.g]]}},h:`<li class="spot"><span class="dot"></span><div><span class="t">${s.t}</span> <span class="kind">${GN(s.gu)}</span><span class="nm">${nm}</span></div><div class="sub">${esc(L(...s.sub))}</div><span class="passb ${s.g}">${L("패스 무료","Pass free")} · ${s.g==="A"?L("A그룹(PURPLE)","Group A (PURPLE)"):L("B그룹(BLUE)","Group B (BLUE)")}</span> ${w.map(x=>`<span class="warn">${esc(x)}</span>`).join(" ")}`});
      } else {
        const r=pickFood(s.gu, s.kind==="cafe"?"cafe":"food", ctx, used, s.label[0]==="저녁"?"dinner":"lunch");
        if(!r) return;
        parts.push({q:r.name,it:{kind:s.kind,label:L(...s.label),name:r.name,q:r.name,url:r.url,sub:foodSub(r),warn:r.warn?[L("평가 50건 미만","Fewer than 50 reviews")]:[]},h:`<li class="${s.kind}"><span class="dot"></span><div><span class="t">${s.t}</span> <span class="kind">${L(...s.label)}</span><span class="nm">§NM§</span></div><div class="sub">${esc(foodSub(r))}</div>${r.warn?`<span class="warn">${L("평가 50건 미만","Fewer than 50 reviews")}</span>`:""}`});
      }
    });
    const placed=parts.filter(p=>p.q);
    const li=parts.map((p,k)=>{
      const j=placed.indexOf(p), nx=parts.slice(k+1).find(x=>x.q);
      const nm=p.q ? nameBtn(p.it, placed[j-1]&&placed[j-1].it, placed[j+1]&&placed[j+1].it, L(...c.leg)) : esc(p.name);
      return p.h.replace("§NM§", nm) + (p.q&&nx ? legNote(c.legModes, L(...c.legTime)) : "") + "</li>";
    }).join("");
    h+=`<article class="day course"><div class="dayhead"><span class="badge" style="background:var(--pb)">${L(`패스 시설 ${n}곳`,`${n} pass spots`)}</span><b>${L(...c.name)}</b><span>${icons(c.legModes)} ${L("구간마다","per leg")} ${esc(L(...c.legTime))}</span></div><ol class="line">${li}</ol></article>`;
  });
  return h+`</div>`;
}

const typeName = t => { const x=TYPES.find(y=>y[0]===t); return L(x[1],x[2]); };
const durName = d => { const x=DURS.find(y=>y[0]===d); return L(x[1],x[2]); };
const pplName = p => L(`${p}명`, `${p} ${p>1?"people":"person"}`);

function renderPlan(){
  const ctx={type:state.type,ppl:state.ppl,dur:state.dur,month:state.month,pass:state.pass};
  const trip=buildTrip(state.gu,ctx);
  const colors=["var(--l1)","var(--l2)","var(--l3)"];
  let h=`<div class="summary"><span class="gu">${GN(state.gu)}</span><span class="pill">${typeName(ctx.type)} · ${pplName(ctx.ppl)}</span><span class="pill">${durName(ctx.dur)}</span><span class="pill">${MN(ctx.month)}</span>${ctx.pass?`<span class="pill">${L("비짓부산패스 있음","Visit Busan Pass")}</span>`:""}${ctx.dur>1?`<span class="pill">${L("숙소","Stay")} ${ST(state.gu)}</span>`:""}</div><div class="days">`;
  trip.forEach((d,i)=>{
    h+=`<article class="day" style="--c:${colors[i]}"><div class="dayhead"><span class="badge" style="background:${colors[i]}">${L(`${i+1}일차`,`Day ${i+1}`)}</span><b>${GN(d.gu)}</b><span>${icons(d.modes)} ${esc(d.time)}</span></div><ol class="line">`;
    if(!d.spotCount) h+=`<li class="spot"><span class="dot"></span><span class="sub">${L("이 조건에 맞는 Top 5 관광지가 없어 맛집·카페 위주로 짰습니다.","No top-5 sight fits these conditions, so this day focuses on food and cafes.")}</span></li>`;
    const placed=d.items.filter(i=>i.q);
    d.items.forEach((it,k)=>{
      const j=placed.indexOf(it), next=d.items.slice(k+1).find(i=>i.q);
      const nm = it.q ? nameBtn(it, placed[j-1], placed[j+1], d.move) : esc(it.name);
      h+=`<li class="${it.kind}"><span class="dot"></span><div><span class="t">${it.t}</span> <span class="kind">${it.label}</span><span class="nm">${nm}</span></div><div class="sub">${esc(it.sub)}</div>${passBadges(it.pass)}${it.warn.map(w=>`<span class="warn">${esc(w)}</span> `).join("")}${it.q&&next?legNote(d.modes,d.time):""}</li>`;
    });
    h+=`</ol></article>`;
  });
  h+=`</div><div class="tips"><span class="label">${L("이 조건에서 고려한 점","What this route takes into account")}</span><ul>${tipsFor(ctx).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  if(ctx.pass) h+=renderCourses(ctx);
  $("plan").innerHTML=h;
}

function renderCompare(){
  const ctx={type:state.type,ppl:state.ppl,dur:state.dur,month:state.month,pass:state.pass};
  $("passth").hidden=!ctx.pass;
  const cond=`${typeName(ctx.type)} · ${pplName(ctx.ppl)} · ${durName(ctx.dur)} · ${MN(ctx.month)}`;
  $("cmpcap").textContent=L(`현재 조건: ${cond}. 구 이름을 누르면 위에 자세한 경로가 열립니다.`,`Current conditions: ${cond}. Select a district to open its full route above.`);
  $("cmp").innerHTML=GUS.map(g=>{
    const d=buildTrip(g,ctx);
    const ch=d[0].items.filter(i=>i.q);
    const chain=ch.map((i,j)=>nameBtn(i, ch[j-1], ch[j+1], d[0].move)).join(" → ");
    const rest=d.slice(1).map(x=>GN(x.gu)).join(", ")||"—";
    const pc=d.flatMap(x=>x.items).filter(i=>i.pass && i.pass.lv!=="near").length;
    return `<tr><td><button data-gu="${g}">${GN(g)}</button></td><td>${chain}</td><td>${rest}</td><td>${ctx.dur>1?ST(g):"—"}</td>${ctx.pass?`<td>${pc?L(pc+"곳",String(pc)):"—"}</td>`:""}</tr>`;
  }).join("");
}

function renderStatic(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i]").forEach(el=>{ const v=UI[el.dataset.i]; if(v) el.textContent=L(v[0],v[1]); });
  $("src").innerHTML = SRC.filter(s=>L(s[0],s[1])).map(s=>`<li>${esc(L(s[0],s[1]))}</li>`).join("");
  $("type").innerHTML = TYPES.map(([v,ko,en])=>`<button type="button" data-v="${v}">${L(ko,en)}</button>`).join("");
  $("ppl").innerHTML = [1,2,3,4].map(p=>`<button type="button" data-v="${p}">${pplName(p)}</button>`).join("");
  $("dur").innerHTML = DURS.map(([v,ko,en])=>`<button type="button" data-v="${v}">${L(ko,en)}</button>`).join("");
  $("pass").innerHTML = [[0,"없음","No"],[1,"있음","Yes"]].map(([v,ko,en])=>`<button type="button" data-v="${v}">${L(ko,en)}</button>`).join("");
  $("month").innerHTML = Array.from({length:12},(_,i)=>`<option value="${i+1}">${MN(i+1)}</option>`).join("");
  $("rail").innerHTML = GUS.map(g=>`<button type="button" data-gu="${g}">${GN(g)}</button>`).join("");
}

function syncControls(){
  const ok=allowedPpl(state.type); if(!ok.includes(state.ppl)) state.ppl=ok[0];
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===state.lang));
  document.querySelectorAll("#type button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===state.type));
  document.querySelectorAll("#ppl button").forEach(b=>{b.disabled=!ok.includes(+b.dataset.v); b.setAttribute("aria-pressed",+b.dataset.v===state.ppl);});
  document.querySelectorAll("#dur button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===state.dur));
  document.querySelectorAll("#pass button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===state.pass));
  document.querySelectorAll("#rail button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.gu===state.gu));
  $("pplhint").textContent= state.type==="s"?L("혼자는 1명으로 고정됩니다","Solo is fixed at 1 person"): state.type==="c"?L("연인은 2명으로 고정됩니다","Couple is fixed at 2 people"):L("2~4명 중에서 고르세요","Choose 2–4 people");
  $("month").value=state.month;
}
function render(){ REG.length=0; syncControls(); renderPlan(); renderCompare(); try{localStorage.setItem("routeState",JSON.stringify(state));}catch(e){} }
function fullRender(){ renderStatic(); render(); }

function bindSeg(id,key){
  $(id).onclick=e=>{const b=e.target.closest("button"); if(!b||b.disabled) return; const v=b.dataset.v; state[key]=isNaN(+v)?v:+v; key==="lang"?fullRender():render();};
}
$("lang").innerHTML = `<button type="button" data-v="ko">한국어</button><button type="button" data-v="en">English</button>`;
bindSeg("lang","lang"); bindSeg("type","type"); bindSeg("ppl","ppl"); bindSeg("dur","dur"); bindSeg("pass","pass");
$("month").onchange=e=>{state.month=+e.target.value; render();};
$("rail").onclick=e=>{const b=e.target.closest("button"); if(b){state.gu=b.dataset.gu; render();}};
$("plan").onclick=e=>{ nameClick(e); };
$("dlgclose").onclick=()=>$("dlg").close();
$("dlg").onclick=e=>{ if(e.target===$("dlg")) $("dlg").close(); };
$("cmp").onclick=e=>{ if(nameClick(e)) return; const b=e.target.closest("button[data-gu]"); if(b){state.gu=b.dataset.gu; render(); $("plan").scrollIntoView({behavior:"smooth",block:"start"});}};
fullRender();
</script>

</body>
</html>
